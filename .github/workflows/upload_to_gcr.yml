name: Upload Python Package to GCR

on:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.11'
  GCP_REGION: 'us-central1'
  ARTIFACT_REGISTRY_REPO: 'python-artifacts-registry'

jobs:
  build-and-upload:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Configure Poetry
      run: poetry config virtualenvs.create false

    - name: Install dependencies
      run: |
        poetry install
        poetry add twine
      

    - name: Set up Google Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
      with:
        project_id: ${{ secrets.GCP_PROJECT_ID }}
        service_account_key: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
        export_default_credentials: true

    - name: Extract version from tag
      id: get_version
      run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

    - name: Update package version
      run: |
        if [[ "${{ steps.get_version.outputs.VERSION }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
          poetry version ${{ steps.get_version.outputs.VERSION }}
        else
          echo "Invalid version format: ${{ steps.get_version.outputs.VERSION }}"
          exit 1
        fi

    - name: Build Python package
      run: poetry build

    - name: Upload package to Google Artifact Registry
      env:
        TWINE_USERNAME: _json_key
        TWINE_PASSWORD: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
      run: |
        poetry run twine upload --repository-url https://${{ env.GCP_REGION }}-python.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/${{ env.ARTIFACT_REGISTRY_REPO }}/ dist/*